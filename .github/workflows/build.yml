name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk N31-MONSIEUR-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: N31-MONSIEUR-${{ github.run_number }}
          path: N31-MONSIEUR-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: N°31 MONSIEUR · ${{ github.run_number }}
          files: N31-MONSIEUR-${{ github.run_number }}.apk
          make_latest: true
