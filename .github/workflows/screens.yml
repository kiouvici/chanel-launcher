name: screens
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: |
          mkdir -p shots
          gradle --no-daemon assembleRelease > shots/build.txt 2>&1 || { tail -60 shots/build.txt; exit 1; }
      - name: Push shots to branch
        if: always()
        run: |
          mkdir -p shots; echo "${{ github.run_id }}" > shots/RUN
          cd shots
          git init -q -b shots && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "shots ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots
